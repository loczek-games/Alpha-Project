<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caught On Camera Ad</title>
<style>
  @font-face { font-family: "Anton"; src: url("fonts/Anton.ttf"); }
  @font-face { font-family: "Elite"; src: url("fonts/SpecialElite.ttf"); }
  html, body { margin: 0; background: #000; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; width: auto; max-width: 100vw; background: #000; }
  body.render canvas { height: auto; width: auto; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/*
  CAUGHT ON CAMERA - 9:16 motion-design ad for players.
  Every frame is a pure function of time: renderFrame(t) draws second t.
  Open the page to preview in real time; tools/render.mjs captures it frame by frame.
*/
const W = 1080, H = 1920, FPS = 30;
let DURATION = 43; // set from the end card below
const cv = document.getElementById("c");
let ctx = cv.getContext("2d");

// ---------- math ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeInOut = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const easeExpo = k => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k));
const easeBack = k => { const c = 2.2; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function noise1(x) { const i = Math.floor(x), f = x - i; const u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; }

// ---------- palette ----------
const RARITY = {
  COMMON: "#c4c4ce", UNUSUAL: "#6ee182", RARE: "#50a5ff", EPIC: "#b95fff",
  MYTHIC: "#ff5faf", NIGHTMARE: "#eb2d2d", IMPOSSIBLE: "#ffd84a", "???": "#ffffff",
};
const RED = "#ff2a3d", CYAN = "#3ef0ff", GOLD = "#ffd84a";

// ---------- cached textures ----------
const grains = [];
for (let g = 0; g < 6; g++) {
  const c = document.createElement("canvas"); c.width = 270; c.height = 480;
  const x = c.getContext("2d"); const img = x.createImageData(270, 480);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0); grains.push(c);
}
const scan = document.createElement("canvas"); scan.width = 4; scan.height = 6;
{ const x = scan.getContext("2d"); x.fillStyle = "rgba(0,0,0,0.35)"; x.fillRect(0, 0, 4, 2); }
const buffer = document.createElement("canvas"); buffer.width = W; buffer.height = H;
const bctx = buffer.getContext("2d");

// ---------- text ----------
function font(size, fam = "Anton") { return `${size}px ${fam === "Anton" ? '"Anton"' : fam === "Elite" ? '"Elite"' : '"JetBrains Mono"'}, Impact, sans-serif`; }

function txt(s, x, y, size, o = {}) {
  ctx.save();
  ctx.font = font(size, o.fam || "Anton");
  ctx.textAlign = o.align || "center";
  ctx.textBaseline = o.base || "middle";
  if (o.tracking) ctx.letterSpacing = o.tracking + "px";
  ctx.globalAlpha *= o.alpha == null ? 1 : o.alpha;
  ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  if (o.scale != null) ctx.scale(o.scale, o.scale);
  if (o.glitch) {
    const g = o.glitch;
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "rgba(255,30,60,0.9)"; ctx.fillText(s, -g, 0);
    ctx.fillStyle = "rgba(30,230,255,0.9)"; ctx.fillText(s, g, 0);
    ctx.globalCompositeOperation = "source-over";
  }
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowSize || 40; }
  if (o.stroke) { ctx.lineJoin = "round"; ctx.lineWidth = o.strokeW || size * 0.12; ctx.strokeStyle = o.stroke; ctx.strokeText(s, 0, 0); }
  ctx.fillStyle = o.color || "#fff";
  ctx.fillText(s, 0, 0);
  if (o.glow) { ctx.shadowBlur = 0; ctx.fillText(s, 0, 0); }
  ctx.restore();
}

// Letters pop in one by one from big + transparent to normal.
function popText(s, x, y, size, lt, o = {}) {
  ctx.save();
  ctx.font = font(size, o.fam || "Anton");
  if (o.tracking) ctx.letterSpacing = o.tracking + "px";
  const widths = [...s].map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0);
  ctx.restore();
  let cx = x - total / 2;
  const stagger = o.stagger == null ? 0.035 : o.stagger;
  [...s].forEach((ch, i) => {
    const k = clamp((lt - i * stagger) / 0.28);
    if (k > 0 && ch !== " ") {
      const sc = lerp(o.from || 2.6, 1, easeBack(k));
      txt(ch, cx + widths[i] / 2, y + (1 - easeOut(k)) * (o.dy || 0), size, { ...o, scale: sc, alpha: clamp(k * 2.5) * (o.alpha == null ? 1 : o.alpha) });
    }
    cx += widths[i];
  });
}

// Typewriter text.
function typeText(s, x, y, size, lt, cps, o = {}) {
  const n = Math.floor(clamp(lt * cps, 0, s.length));
  const caret = (Math.floor(lt * 3) % 2 === 0 && n < s.length + 1) ? "_" : " ";
  txt(s.slice(0, n) + (o.caret === false ? "" : caret), x, y, size, { fam: "Elite", ...o });
}

// Rounded label pill.
function pill(label, x, y, size, color, o = {}) {
  ctx.save();
  ctx.font = font(size, "Anton"); ctx.letterSpacing = (o.tracking || 4) + "px";
  const w = ctx.measureText(label).width + size * 1.1, h = size * 1.6;
  ctx.translate(x, y); if (o.scale) ctx.scale(o.scale, o.scale);
  ctx.globalAlpha *= o.alpha == null ? 1 : o.alpha;
  ctx.shadowColor = color; ctx.shadowBlur = o.glow || 30;
  ctx.fillStyle = o.fill || color;
  roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = o.textColor || "#0b0b10"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label, 0, size * 0.05);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function star(x, y, r, fill) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}

function glowDot(x, y, r, color, alpha = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.save(); ctx.globalAlpha *= alpha; ctx.globalCompositeOperation = "lighter";
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}

// ---------- the mall corridor (one-point perspective) ----------
// World: x in [-6,6], y in [-4 (ceiling), 4 (floor)], camera looking down +z.
function mall(o = {}) {
  const vx = o.vx == null ? W / 2 : o.vx, vy = o.vy == null ? H * 0.47 : o.vy;
  const f = o.f || 230;
  const camZ = o.z || 0;
  const light = o.light == null ? 1 : o.light;
  const tint = o.tint || [255, 236, 200];
  const P = (x, y, z) => [vx + (x * f) / z, vy + (y * f) / z];
  const fog = z => Math.exp(-z / (o.fogDist || 14));
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  ctx.fillStyle = o.bg || "#050507"; ctx.fillRect(0, 0, W, H);
  const zN = 0.6, zF = 60;
  const quad = (pts, fill) => { ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(...p) : ctx.moveTo(...p))); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); };
  // floor / ceiling / walls gradients
  const fl = ctx.createLinearGradient(0, H, 0, vy);
  fl.addColorStop(0, rgba(o.floor || [46, 40, 38], 1)); fl.addColorStop(1, "rgba(0,0,0,1)");
  quad([P(-6, 4, zN), P(6, 4, zN), P(6, 4, zF), P(-6, 4, zF)], fl);
  const cl = ctx.createLinearGradient(0, 0, 0, vy);
  cl.addColorStop(0, rgba(o.ceil || [24, 24, 30], 1)); cl.addColorStop(1, "rgba(0,0,0,1)");
  quad([P(-6, -4, zN), P(6, -4, zN), P(6, -4, zF), P(-6, -4, zF)], cl);
  for (const s of [-1, 1]) {
    const wg = ctx.createLinearGradient(s < 0 ? 0 : W, 0, vx, 0);
    wg.addColorStop(0, rgba(o.wall || [34, 30, 36], 1)); wg.addColorStop(1, "rgba(0,0,0,1)");
    quad([P(6 * s, -4, zN), P(6 * s, 4, zN), P(6 * s, 4, zF), P(6 * s, -4, zF)], wg);
  }
  // floor tiles
  ctx.lineWidth = 2;
  const off = camZ % 2;
  for (let k = 0; k < 30; k++) {
    const z = 1 + k * 2 - off; if (z < zN) continue;
    const a = fog(z) * 0.35 * light;
    ctx.strokeStyle = rgba(tint, a);
    ctx.beginPath(); ctx.moveTo(...P(-6, 4, z)); ctx.lineTo(...P(6, 4, z)); ctx.stroke();
  }
  for (let x = -6; x <= 6; x += 2) {
    const g = ctx.createLinearGradient(...P(x, 4, zN), ...P(x, 4, 25));
    g.addColorStop(0, rgba(tint, 0.25 * light)); g.addColorStop(1, rgba(tint, 0));
    ctx.strokeStyle = g; ctx.beginPath(); ctx.moveTo(...P(x, 4, zN)); ctx.lineTo(...P(x, 4, zF)); ctx.stroke();
  }
  // storefronts with shutters and neon signs
  const segs = [];
  for (let k = 0; k < 12; k++) {
    const z0 = 1.5 + k * 6 - (camZ % 6);
    if (z0 + 4.5 < zN) continue;
    for (const s of [-1, 1]) segs.push({ z0: Math.max(z0, zN), z1: z0 + 4.5, s, id: k + Math.floor(camZ / 6) + (s > 0 ? 100 : 0) });
  }
  segs.sort((a, b) => b.z0 - a.z0);
  for (const g of segs) {
    const a = fog(g.z0) * light;
    if (a < 0.01) continue;
    // shutter
    quad([P(6 * g.s, -1.6, g.z0), P(6 * g.s, 4, g.z0), P(6 * g.s, 4, g.z1), P(6 * g.s, -1.6, g.z1)], rgba([60, 58, 66], 0.55 * a));
    ctx.strokeStyle = rgba([10, 10, 14], 0.6 * a); ctx.lineWidth = 1.5;
    for (let y = -1.4; y < 4; y += 0.35) { ctx.beginPath(); ctx.moveTo(...P(6 * g.s, y, g.z0)); ctx.lineTo(...P(6 * g.s, y, g.z1)); ctx.stroke(); }
    // sign
    const neon = (o.signs || ["#ff3d6e", "#3ef0ff", "#ffd84a", "#b95fff", "#6ee182"])[Math.floor(hash(g.id) * 5)];
    const dead = hash(g.id * 3.1) < 0.35;
    const flick = dead ? 0.08 : (noise1(g.id * 9 + (o.t || 0) * 14) > -0.6 ? 1 : 0.15);
    const c1 = P(6 * g.s, -2.8, g.z0 + 0.6), c2 = P(6 * g.s, -2.0, g.z1 - 0.6);
    ctx.save(); ctx.globalAlpha = a * flick * (o.neon == null ? 1 : o.neon);
    ctx.shadowColor = neon; ctx.shadowBlur = 30; ctx.strokeStyle = neon; ctx.lineWidth = 4;
    ctx.strokeRect(Math.min(c1[0], c2[0]), c1[1], Math.abs(c2[0] - c1[0]), c2[1] - c1[1]);
    ctx.restore();
  }
  // ceiling lights
  for (let k = 0; k < 10; k++) {
    const z = 2 + k * 5 - (camZ % 5); if (z < zN) continue;
    const id = k + Math.floor(camZ / 5);
    let on = light * fog(z);
    if (o.flicker) on *= noise1(id * 7 + (o.t || 0) * 22) > -0.2 ? 1 : 0.05;
    if (hash(id * 1.7) < (o.deadLights || 0.3)) on *= 0.06;
    if (on < 0.02) continue;
    quad([P(-1.2, -3.98, z), P(1.2, -3.98, z), P(1.2, -3.98, z + 1.6), P(-1.2, -3.98, z + 1.6)], rgba(tint, on));
    const [lx, ly] = P(0, -3.6, z + 0.8);
    glowDot(lx, ly, 900 / z, rgba(tint, 0.35), on);
    const [fx, fy] = P(0, 4, z + 0.8);
    glowDot(fx, fy, 1200 / z, rgba(tint, 0.18), on);
  }
  return { P, vx, vy, f, fog };
}

// ---------- characters ----------
// All drawn with origin at the feet, h = pixel height.
function mannequin(x, y, h, turn = 0, lit = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(h / 100, h / 100);
  const skin = `rgba(${Math.round(210 * lit)},${Math.round(198 * lit)},${Math.round(182 * lit)},1)`;
  ctx.fillStyle = skin;
  // legs
  ctx.fillRect(-9, -46, 7, 46); ctx.fillRect(2, -46, 7, 46);
  // torso
  ctx.beginPath(); ctx.moveTo(-14, -80); ctx.lineTo(14, -80); ctx.lineTo(10, -44); ctx.lineTo(-10, -44); ctx.closePath(); ctx.fill();
  // arms
  ctx.save(); ctx.translate(-14, -78); ctx.rotate(0.12); ctx.fillRect(-5, 0, 5, 36); ctx.restore();
  ctx.save(); ctx.translate(14, -78); ctx.rotate(-0.12); ctx.fillRect(0, 0, 5, 36); ctx.restore();
  // neck + head
  ctx.fillRect(-3, -86, 6, 8);
  ctx.beginPath(); ctx.ellipse(0, -94, 8, 10, 0, 0, Math.PI * 2); ctx.fill();
  if (turn > 0) { // face appears as the head turns toward camera
    ctx.globalAlpha = turn;
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.ellipse(-3, -96, 1.8, 2.4, 0, 0, 7); ctx.ellipse(3, -96, 1.8, 2.4, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "#000"; ctx.lineWidth = 0.9; ctx.beginPath(); ctx.arc(0, -91, 3, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.shadowColor = RED; ctx.shadowBlur = 6; ctx.fillStyle = RED;
    ctx.beginPath(); ctx.arc(-3, -96, 0.7, 0, 7); ctx.arc(3, -96, 0.7, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function shadowFigure(x, y, h, eyes = 1, eyeColor = "#fff", jag = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(h / 100, h / 100);
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.moveTo(-8, 0); ctx.lineTo(-11 + jag * noise1(1), -50); ctx.lineTo(-17, -78); ctx.quadraticCurveTo(-18, -84, -9, -86);
  ctx.lineTo(-8, -92); ctx.ellipse(0, -96, 9, 11, 0, Math.PI, 0); ctx.lineTo(8, -86);
  ctx.quadraticCurveTo(18, -84, 17, -78); ctx.lineTo(11, -50); ctx.lineTo(8, 0); ctx.lineTo(2, 0); ctx.lineTo(0, -40); ctx.lineTo(-2, 0);
  ctx.closePath(); ctx.fill();
  // long arms
  ctx.fillRect(-21, -80, 5, 52); ctx.fillRect(16, -80, 5, 52);
  if (eyes > 0) {
    ctx.globalAlpha = eyes; ctx.shadowColor = eyeColor; ctx.shadowBlur = 14; ctx.fillStyle = eyeColor;
    ctx.beginPath(); ctx.ellipse(-3.5, -97, 1.8, 1.2, 0, 0, 7); ctx.ellipse(3.5, -97, 1.8, 1.2, 0, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function glowingEyes(x, y, s, color = "#fff", a = 1, blink = 1) {
  ctx.save(); ctx.globalAlpha = a; ctx.shadowColor = color; ctx.shadowBlur = s * 2; ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(x - s * 1.6, y, s, s * 0.55 * blink, 0, 0, 7); ctx.ellipse(x + s * 1.6, y, s, s * 0.55 * blink, 0, 0, 7); ctx.fill();
  ctx.restore();
  glowDot(x, y, s * 6, color, a * 0.25);
}

// The Ceiling Crawler, hanging upside-down. (x,y) = body centre.
function crawler(x, y, s, t, faceA = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 100, s / 100);
  ctx.strokeStyle = "#141114"; ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (let i = 0; i < 6; i++) {
    const side = i < 3 ? -1 : 1, k = i % 3;
    const sw = Math.sin(t * 9 + i * 1.9) * 6;
    const ax = side * (18 + k * 6), ay = -10 + k * 12;
    const kx = side * (70 + k * 12) + sw, ky = -70 + k * 30;
    const fx = side * (110 + k * 8), fy = -112;
    ctx.lineWidth = 12; ctx.strokeStyle = "rgba(150,140,150,0.35)"; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
    ctx.lineWidth = 9; ctx.strokeStyle = "#1e181c"; ctx.stroke();
  }
  ctx.fillStyle = "#1a1519";
  ctx.beginPath(); ctx.ellipse(0, 0, 30, 46, 0, 0, 7); ctx.fill();
  // human face hanging under the body
  ctx.globalAlpha = faceA;
  const skin = ctx.createRadialGradient(0, 44, 4, 0, 52, 36);
  skin.addColorStop(0, "#cfc7bd"); skin.addColorStop(0.7, "#8e867e"); skin.addColorStop(1, "#3a3430");
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.ellipse(0, 52, 26, 33, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(60,20,30,0.55)"; ctx.lineWidth = 0.8; // veins
  for (let v = 0; v < 6; v++) { ctx.beginPath(); ctx.moveTo(-20 + v * 8, 26 + (v % 2) * 4); ctx.lineTo(-17 + v * 7, 34); ctx.lineTo(-14 + v * 6, 38 + (v % 3)); ctx.stroke(); }
  ctx.fillStyle = "#050303";
  ctx.beginPath(); ctx.ellipse(-10, 45, 7.5, 10, 0.15, 0, 7); ctx.ellipse(10, 45, 7.5, 10, -0.15, 0, 7); ctx.fill();
  ctx.fillStyle = "#ff2a3d"; ctx.shadowColor = "#ff2a3d"; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(-10, 46, 1.5, 0, 7); ctx.arc(10, 46, 1.5, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  const jaw = 9 + Math.sin(t * 20) * 2.5;
  ctx.fillStyle = "#050303"; ctx.beginPath(); ctx.ellipse(0, 70, 14, jaw, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#d8ccb0";
  for (let k = -3; k <= 3; k++) {
    ctx.beginPath(); ctx.moveTo(k * 3.6 - 1.6, 70 - jaw + 1); ctx.lineTo(k * 3.6 + 1.6, 70 - jaw + 1); ctx.lineTo(k * 3.6, 70 - jaw + 6); ctx.fill();
    ctx.beginPath(); ctx.moveTo(k * 3.6 - 1.6, 70 + jaw - 1); ctx.lineTo(k * 3.6 + 1.6, 70 + jaw - 1); ctx.lineTo(k * 3.6, 70 + jaw - 6); ctx.fill();
  }
  ctx.restore();
}

function smiler(x, y, s, a = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 100, s / 100); ctx.globalAlpha = a;
  ctx.fillStyle = "#e9e4dc"; ctx.beginPath(); ctx.ellipse(0, 0, 40, 50, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#000"; ctx.beginPath(); ctx.ellipse(-14, -12, 6, 9, 0, 0, 7); ctx.ellipse(14, -12, 6, 9, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-32, 10); ctx.quadraticCurveTo(0, 52, 32, 10); ctx.quadraticCurveTo(0, 30, -32, 10); ctx.fill();
  ctx.fillStyle = "#fff";
  for (let i = -5; i <= 5; i++) { const tx = i * 5.4, ty = 16 + (1 - Math.abs(i) / 6) * 8; ctx.fillRect(tx - 2, ty, 4, 7 + (1 - Math.abs(i) / 6) * 5); }
  ctx.restore();
}

function ratthew(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 100, s / 100);
  ctx.fillStyle = "#7c6e66";
  ctx.beginPath(); ctx.arc(-34, -40, 20, 0, 7); ctx.arc(34, -40, 20, 0, 7); ctx.fill();
  ctx.fillStyle = "#d48a96"; ctx.beginPath(); ctx.arc(-34, -40, 11, 0, 7); ctx.arc(34, -40, 11, 0, 7); ctx.fill();
  ctx.fillStyle = "#8d7f76"; ctx.beginPath(); ctx.ellipse(0, 0, 44, 46, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#b9aca2"; ctx.beginPath(); ctx.ellipse(0, 22, 26, 20, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(-16, -8, 8, 0, 7); ctx.arc(16, -8, 8, 0, 7); ctx.fill();
  ctx.fillStyle = RED; ctx.shadowColor = RED; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(-16, -8, 2.5, 0, 7); ctx.arc(16, -8, 2.5, 0, 7); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = "#1a1012"; ctx.beginPath(); ctx.ellipse(0, 12, 7, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#f2ead0"; ctx.fillRect(-7, 26, 6, 12); ctx.fillRect(1, 26, 6, 12);
  ctx.restore();
}

function clockFace(x, y, s, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 100, s / 100);
  ctx.fillStyle = "#e8e2d4"; ctx.strokeStyle = "#2a2422"; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(0, 0, 50, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#2a2422";
  for (let i = 0; i < 12; i++) { ctx.save(); ctx.rotate(i * Math.PI / 6); ctx.fillRect(-2, -44, 4, 9); ctx.restore(); }
  ctx.strokeStyle = "#111"; ctx.lineCap = "round";
  ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.sin(-t * 0.8) * 22, -Math.cos(-t * 0.8) * 22); ctx.stroke();

  ctx.restore();
}

function door(x, y, s, open) {

  ctx.fillStyle = "#4a3a30";
  const w = 60 * (1 - open * 0.75);
  ctx.fillRect(-30, -100, w, 100);
  ctx.fillStyle = "#c9a35a"; ctx.beginPath(); ctx.arc(-30 + w - 7, -50, 3.5, 0, 7); ctx.fill();
  ctx.strokeStyle = "#2a1f1a"; ctx.lineWidth = 3; ctx.strokeRect(-30, -100, 60, 100);
  ctx.restore();
}

function photographer(x, y, h, flash) {
  shadowFigure(x, y, h, 0);
  ctx.save(); ctx.translate(x, y); ctx.scale(h / 100, h / 100);
  ctx.fillStyle = "#16161a"; ctx.fillRect(-14, -108, 28, 20); ctx.fillRect(-6, -112, 10, 5);
  ctx.fillStyle = "#333"; ctx.beginPath(); ctx.arc(0, -98, 7, 0, 7); ctx.fill();
  ctx.fillStyle = "#9ad"; ctx.beginPath(); ctx.arc(0, -98, 3.5, 0, 7); ctx.fill();
  ctx.restore();

}

function observerEye(x, y, s, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 100, s / 100);
  ctx.fillStyle = "#e8e0d0";
  ctx.beginPath(); ctx.moveTo(-60, 0); ctx.quadraticCurveTo(0, -46, 60, 0); ctx.quadraticCurveTo(0, 46, -60, 0); ctx.fill();
  ctx.save(); ctx.clip();
  const px = Math.sin(t * 1.3) * 10;
  ctx.fillStyle = "#c79a1e"; ctx.beginPath(); ctx.arc(px, 0, 24, 0, 7); ctx.fill();
  ctx.fillStyle = "#000"; ctx.beginPath(); ctx.ellipse(px, 0, 5, 20, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(160,30,30,0.6)"; ctx.lineWidth = 1.5;

  ctx.restore();
  ctx.restore();
  glowDot(x, y, s * 1.4, GOLD, 0.4);
}

function nightManager(x, y, h) {

  ctx.fillStyle = "#8a0f1a"; ctx.beginPath(); ctx.moveTo(-2, -88); ctx.lineTo(2, -88); ctx.lineTo(3, -66); ctx.lineTo(0, -62); ctx.lineTo(-3, -66); ctx.closePath(); ctx.fill();
  ctx.fillStyle = GOLD; ctx.fillRect(7, -82, 8, 4);

// Blocky Roblox-style investigator.
function avatar(x, y, h, shirt, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(h / 100, h / 100);
  const sw = Math.sin((o.walk || 0) * 8) * 8;

  ctx.save(); ctx.translate(9, -46); ctx.rotate(-sw * 0.02); ctx.fillRect(-8, 0, 16, 46); ctx.restore();
  ctx.fillStyle = shirt; ctx.fillRect(-18, -86, 36, 42);
  ctx.fillStyle = o.skin || "#f2c99a";
  ctx.save(); ctx.translate(-26, -86); ctx.rotate(-sw * 0.02); ctx.fillRect(-8, 0, 16, 40); ctx.restore();
  ctx.save(); ctx.translate(26, -86); ctx.rotate(o.armUp ? -1.3 : sw * 0.02); ctx.fillRect(-8, 0, 16, 40); ctx.restore();
  roundRect(-14, -114, 28, 28, 5); ctx.fill();
  ctx.fillStyle = "#111"; ctx.fillRect(-7, -104, 4, 5); ctx.fillRect(3, -104, 4, 5);
  if (o.smile) { ctx.strokeStyle = "#111"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, -97, 5, 0.3, Math.PI - 0.3); ctx.stroke(); }
  if (o.cap) { ctx.fillStyle = o.cap; ctx.fillRect(-15, -118, 30, 8); ctx.fillRect(-15, -112, 36, 3); }
  ctx.restore();
}

// ---------- overlays ----------
function grain(t, a = 0.09) {
  ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = "overlay";
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(grains[Math.floor(t * FPS) % grains.length], 0, 0, W, H);
  ctx.restore();
}
function scanlines(a = 0.5) {
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = ctx.createPattern(scan, "repeat"); ctx.fillRect(0, 0, W, H); ctx.restore();
}
function vignette(a = 0.85, color = "0,0,0") {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.22, W / 2, H / 2, H * 0.72);
  g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function flash(a, color = "255,255,255") { if (a <= 0) return; ctx.fillStyle = `rgba(${color},${clamp(a)})`; ctx.fillRect(0, 0, W, H); }
function tint(color, a, mode = "multiply") { ctx.save(); ctx.globalCompositeOperation = mode; ctx.globalAlpha = a; ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); ctx.restore(); }

// Horizontal slice displacement + RGB split on the finished frame.
function glitch(t, amount) {
  if (amount <= 0) return;
  bctx.clearRect(0, 0, W, H); bctx.drawImage(cv, 0, 0);
  const n = 7 + Math.floor(amount * 10);
  for (let i = 0; i < n; i++) {
    const y = hash(i * 13 + Math.floor(t * 24) * 7) * H, h = 10 + hash(i * 5 + Math.floor(t * 24)) * 120 * amount;
    const dx = (hash(i * 3 + Math.floor(t * 24) * 11) - 0.5) * 160 * amount;
    ctx.drawImage(buffer, 0, y, W, h, dx, y, W, h);
  }
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.35 * amount;
  ctx.drawImage(buffer, 14 * amount, 0); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.globalAlpha = 0.3 * amount; ctx.fillStyle = "#ff0044"; ctx.fillRect(0, 0, W, H); ctx.restore();
}

function recHud(t, label, o = {}) {
  ctx.save();
  const m = 64;
  ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 6;
  const L = 80;
  [[m, m + 120, 1, 1], [W - m, m + 120, -1, 1], [m, H - m - 260, 1, -1], [W - m, H - m - 260, -1, -1]].forEach(([x, y, sx, sy]) => {
    ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke();
  });
  if (Math.floor(t * 2) % 2 === 0) { ctx.fillStyle = RED; ctx.shadowColor = RED; ctx.shadowBlur = 20; ctx.beginPath(); ctx.arc(m + 60, m + 180, 16, 0, 7); ctx.fill(); ctx.shadowBlur = 0; }
  txt("REC", m + 90, m + 182, 44, { fam: "mono", align: "left", color: "#fff" });
  const secs = 13 * 60 + 7 + t;
  const ts = `03:${String(Math.floor(secs / 60) % 60).padStart(2, "0")}:${String(Math.floor(secs % 60)).padStart(2, "0")} AM`;
  txt(ts, W - m - 30, m + 182, 40, { fam: "mono", align: "right", color: "#fff" });
  if (label) txt(label, m + 30, H - m - 300, 36, { fam: "mono", align: "left", color: "rgba(255,255,255,0.9)" });
  if (o.battery !== false) {
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.strokeRect(W - m - 110, H - m - 320, 70, 32); ctx.fillStyle = "#fff"; ctx.fillRect(W - m - 40, H - m - 310, 6, 12);
    ctx.fillStyle = Math.floor(t * 3) % 2 ? RED : "#fff"; ctx.fillRect(W - m - 106, H - m - 316, 18, 24);
  }
  ctx.restore();
}

// Camera viewfinder (rear-screen style) with focus box.
function viewfinder(t, fx, fy, fs, lock, o = {}) {
  ctx.save();
  ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 3;
  // rule of thirds
  ctx.globalAlpha = 0.22;
  for (let i = 1; i < 3; i++) { ctx.beginPath(); ctx.moveTo(W * i / 3, 0); ctx.lineTo(W * i / 3, H); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, H * i / 3); ctx.lineTo(W, H * i / 3); ctx.stroke(); }
  ctx.globalAlpha = 1;
  const col = lock ? (o.lockColor || "#5dff7a") : "#fff";
  ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.shadowColor = col; ctx.shadowBlur = lock ? 20 : 0;
  const L = fs * 0.28;
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => {
    const x = fx + sx * fs / 2, y = fy + sy * fs / 2;
    ctx.beginPath(); ctx.moveTo(x, y - sy * L); ctx.lineTo(x, y); ctx.lineTo(x - sx * L, y); ctx.stroke();
  });
  ctx.shadowBlur = 0;
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(fx, fy, 5, 0, 7); ctx.fill();
  txt("ISO 6400   f/1.8   1/60", W / 2, H - 330, 34, { fam: "mono", color: "rgba(255,255,255,0.85)" });
  txt(lock ? "● FOCUS LOCK" : "○ AF ...", W / 2, H - 380, 36, { fam: "mono", color: col });
  ctx.restore();
}

// Shutter iris closing/opening, k in [0,1] = closed amount.
function iris(k, cx = W / 2, cy = H / 2) {
  if (k <= 0) return;
  ctx.save(); ctx.fillStyle = "#050505";
  const R = Math.hypot(W, H);
  const r = R * (1 - easeInOut(k));
  for (let i = 0; i < 7; i++) {
    const a = i * Math.PI * 2 / 7 + k * 0.8;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    ctx.lineTo(cx + Math.cos(a) * R * 1.5, cy + Math.sin(a) * R * 1.5);
    ctx.lineTo(cx + Math.cos(a + 1.2) * R * 1.5, cy + Math.sin(a + 1.2) * R * 1.5);
    ctx.lineTo(cx + Math.cos(a + 0.9) * r, cy + Math.sin(a + 0.9) * r);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#1c1c1c"; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.rect(W, 0, -W, H); ctx.fill("evenodd");
  ctx.restore();
}

// Diagonal wipe transition bars.
function wipe(k, color = RED, dir = 1) {
  if (k <= 0 || k >= 1) return;
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(-0.35 * dir);
  const span = 3200, x = lerp(-span, span, easeInOut(k));
  const cols = [color, "#fff", "#000"];
  cols.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(x - 1100 + i * 260 * dir, -2000, 1100, 4000); });
  ctx.restore();
}

// ---------- scenes ----------
const scenes = [];
const scene = (start, end, draw) => scenes.push({ start, end, draw });

// 1. HOOK: security camera footage
scene(0, 3.0, (lt) => {
  const z = lt * 1.2;
  const near = lt > 2.35;

  // figure at the end of the hall, then right in front of the camera

    const [fx, fy] = m.P(0.4, 4, 22);
    const vis = noise1(lt * 6) > -0.3 ? 1 : 0;
    shadowFigure(fx, fy, 1.6 * m.f * 8 / 22 * 0.95, vis, "#fff");
  } else {
    const k = easeIn(prog(lt, 2.35, 2.6));
    const [fx, fy] = m.P(0.2, 4, lerp(10, 2.4, k));
    shadowFigure(fx, fy + 200 * k, lerp(400, 1900, k), 1, "#fff");
  }
  tint("#1d3a2a", 0.35, "color");
  tint("#7fa", 0.08, "overlay");
  recHud(lt, "CAM 04  -  GRAND HALL");

  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(0, 560, W, 330);

  grain(lt, 0.18); scanlines(0.55);
  glitch(lt, near ? 1 : (noise1(lt * 3) > 0.75 ? 0.4 : 0));

});

// 2. TITLE SLAM
scene(3.0, 5.6, (lt) => {
  ctx.fillStyle = "#07070a"; ctx.fillRect(0, 0, W, H);
  // radial burst
  ctx.save(); ctx.translate(W / 2, H * 0.46); ctx.rotate(lt * 0.25);
  for (let i = 0; i < 24; i++) {
    ctx.rotate(Math.PI * 2 / 24);
    ctx.fillStyle = i % 2 ? "rgba(255,42,61,0.10)" : "rgba(255,255,255,0.03)";
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(2000, -140); ctx.lineTo(2000, 140); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  glowDot(W / 2, H * 0.46, 700, "rgba(255,42,61,0.55)", 0.8 + 0.2 * Math.sin(lt * 12));
  // giant lens rings
  ctx.save(); ctx.translate(W / 2, H * 0.46);
  const ringK = easeExpo(prog(lt, 0.0, 0.6));
  for (let i = 0; i < 4; i++) {
    ctx.strokeStyle = `rgba(255,255,255,${0.12 + i * 0.05})`; ctx.lineWidth = 10 - i * 2;
    ctx.beginPath(); ctx.arc(0, 0, (520 - i * 90) * ringK, lt * (i % 2 ? 1 : -1), lt * (i % 2 ? 1 : -1) + Math.PI * 1.6); ctx.stroke();
  }
  ctx.restore();
  const shake = Math.max(0, 1 - lt * 3) * 30;
  ctx.save(); ctx.translate((hash(lt * 99) - 0.5) * shake, (hash(lt * 77) - 0.5) * shake);
  const s1 = easeBack(prog(lt, 0.05, 0.35)), s2 = easeBack(prog(lt, 0.22, 0.5)), s3 = easeBack(prog(lt, 0.38, 0.7));
  txt("CAUGHT", W / 2, H * 0.36, 250, { scale: lerp(3, 1, s1), alpha: clamp(s1 * 3), stroke: "#000", strokeW: 22, glitch: 8 });
  txt("ON", W / 2, H * 0.455, 120, { scale: lerp(3, 1, s2), alpha: clamp(s2 * 3), color: RED, stroke: "#000", strokeW: 16, glow: RED });
  txt("CAMERA", W / 2, H * 0.55, 250, { scale: lerp(3, 1, s3), alpha: clamp(s3 * 3), stroke: "#000", strokeW: 22, glitch: 8 });
  ctx.restore();
  // REC dot + tagline
  const tk = prog(lt, 1.0, 1.4);
  if (tk > 0) {
    pill("A ROBLOX HORROR GAME", W / 2, H * 0.66, 46, "#fff", { alpha: tk, scale: lerp(0.6, 1, easeBack(tk)) });
  }
  if (lt > 1.55) popText("SPOT IT.  SNAP IT.  SURVIVE.", W / 2, H * 0.73, 64, lt - 1.55, { color: "#fff", stagger: 0.02, from: 1.8 });
  flash(1 - prog(lt, 0, 0.25));
  flash(1 - prog(lt, 0.38, 0.55), "255,42,61");
  grain(lt, 0.12); vignette(0.75);
  iris(prog(lt, 2.25, 2.6));
});

// The mannequin shot, reused frozen inside the photo.
function spotShot(lt, withHud) {
  const z = 4 + lt * 0.6;
  const m = mall({ z, light: 0.85, t: lt, vx: W / 2 + Math.sin(lt * 0.9) * 30, deadLights: 0.25 });
  const [fx, fy] = m.P(1.0, 4, 6.5);
  const turn = easeInOut(prog(lt, 1.1, 1.6));
  // display: three mannequins, the middle one turns
  const hgt = 8 * m.f / 6.5 * 0.92;
  mannequin(fx - 270, fy, hgt, 0, 0.75);
  mannequin(fx + 270, fy, hgt, 0, 0.75);
  mannequin(fx, fy, hgt, turn, 0.95);
  glowDot(fx, fy - hgt * 0.8, 500, "rgba(255,240,200,0.18)", 1);
  vignette(0.7);
  return { fx, fy: fy - hgt * 0.62, hgt };
}

// 3. SPOT IT
scene(5.6, 9.0, (lt) => {

});

// 4. SNAP IT -> photo developed
const photoCache = document.createElement("canvas"); photoCache.width = W; photoCache.height = H;
let photoReady = false;
function bakePhoto() {
  const real = ctx;
  ctx = photoCache.getContext("2d");
  try { spotShot(2.4); flash(0.08); } finally { ctx = real; }
  photoReady = true;
}

scene(9.0, 11.6, (lt) => {
  if (!photoReady) bakePhoto();
  // background: blurred memory of the scene, red tint
  ctx.fillStyle = "#0a0608"; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = 0.35; ctx.filter = "blur(18px)"; ctx.drawImage(photoCache, 0, 0); ctx.restore();
  tint("#ff2a3d", 0.25, "overlay");
  // speed lines
  ctx.save(); ctx.translate(W / 2, H / 2);
  for (let i = 0; i < 40; i++) {
    const a = hash(i) * Math.PI * 2, r0 = 380 + ((lt * 1400 + hash(i * 3) * 900) % 900);
    ctx.strokeStyle = `rgba(255,255,255,${0.15 + hash(i * 7) * 0.2})`; ctx.lineWidth = 3 + hash(i * 9) * 5;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); ctx.lineTo(Math.cos(a) * (r0 + 160), Math.sin(a) * (r0 + 160)); ctx.stroke();
  }
  ctx.restore();
  // polaroid
  const k = easeBack(prog(lt, 0.05, 0.45));
  ctx.save(); ctx.translate(W / 2, H * 0.47); ctx.rotate(lerp(-0.6, -0.06, k) + Math.sin(lt * 2) * 0.01); ctx.scale(lerp(0.2, 1, k), lerp(0.2, 1, k));
  ctx.shadowColor = "rgba(0,0,0,0.7)"; ctx.shadowBlur = 60; ctx.fillStyle = "#f4f1ea";
  ctx.fillRect(-380, -500, 760, 960); ctx.shadowBlur = 0;
  const dev = prog(lt, 0.2, 1.1); // photo "develops"
  ctx.drawImage(photoCache, 160, 380, 760, 1000, -340, -460, 680, 760);
  ctx.fillStyle = `rgba(20,16,14,${1 - dev})`; ctx.fillRect(-340, -460, 680, 760);
  for (let i = 0; i < 5; i++) {
    const sk = easeBack(prog(lt, 0.7 + i * 0.12, 0.95 + i * 0.12));
    if (sk > 0) { ctx.save(); ctx.translate(-240 + i * 120, 380); ctx.scale(sk, sk); ctx.shadowColor = GOLD; ctx.shadowBlur = 20; star(0, 0, 48, GOLD); ctx.restore(); }
  }
  ctx.restore();
  popText("SNAP IT!", W / 2, 250, 190, lt - 0.0, { color: "#fff", stroke: "#000", strokeW: 18, glitch: 5 });
  const bk = prog(lt, 1.35, 1.6);
  if (bk > 0) {
    pill("NEW DISCOVERY!", W / 2, 1470, 64, GOLD, { scale: lerp(2, 1, easeBack(bk)), alpha: bk, glow: 60 });
    txt("WATCHING MANNEQUIN", W / 2, 1600, 70, { alpha: bk, stroke: "#000" });
    pill("RARE", W / 2, 1690, 40, RARITY.RARE, { alpha: bk, textColor: "#fff" });
  }
  flash(1 - prog(lt, 0, 0.2));
  grain(lt, 0.1); vignette(0.6);
  wipe(prog(lt, 2.2, 2.6), CYAN);
});

// 5. GEAR UP - equipment montage

    const k = prog(lt, 1.6, 1.85);
    ctx.save(); ctx.fillStyle = `rgba(0,0,0,${0.6 * k})`; ctx.fillRect(0, 0, W, H); ctx.restore();
    glowDot(W / 2, H * 0.5, 900, RARITY.MYTHIC, k * 0.9);
    pill("MYTHIC CAPTURED!", W / 2, H * 0.47, 80, RARITY.MYTHIC, { scale: lerp(2.4, 1, easeBack(k)), alpha: k, textColor: "#fff", glow: 80 });
    txt("FOUND BY YOU", W / 2, H * 0.55, 70, { alpha: prog(lt, 1.9, 2.1), color: "#fff", stroke: "#000", tracking: 8 });
  }
  flash((1 - prog(lt, 1.6, 1.75)) * (lt > 1.6 ? 0.9 : 0), "255,95,175");
  grain(lt, 0.08); vignette(0.65);
});

// 11. END CARD
const END_START = AL_START + 3.0;
DURATION = END_START + 4.2;
scene(END_START, 999, (lt) => {
  mall({ z: lt * 0.8, light: 0.25, t: lt, deadLights: 0.5 });
  tint("#000", 0.55, "source-over");
  // eyes opening in the dark behind the logo
  for (let e = 0; e < 7; e++) {
    const a = prog(lt, 0.8 + e * 0.25, 1.1 + e * 0.25);
    const blink = Math.sin(lt * 2 + e) > 0.96 ? 0.1 : 1;
    glowingEyes(140 + hash(e * 4) * 800, 300 + hash(e * 8) * 1300, 8 + hash(e) * 6, e % 3 === 0 ? RED : "#fff", a * 0.9, blink);
  }
  const k = easeBack(prog(lt, 0.05, 0.45));
  // camera icon
  ctx.save(); ctx.translate(W / 2, H * 0.3); ctx.scale(k, k); ctx.rotate((1 - k) * -0.5);
  ctx.fillStyle = "#16161c"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 10;
  roundRect(-190, -110, 380, 240, 34); ctx.fill(); ctx.stroke();
  ctx.fillRect(-70, -150, 140, 44); ctx.strokeRect(-70, -150, 140, 44);
  ctx.beginPath(); ctx.arc(0, 10, 82, 0, 7); ctx.fillStyle = "#000"; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 10, 46, 0, 7); ctx.fillStyle = "#1c3550"; ctx.fill();
  ctx.fillStyle = RED; ctx.shadowColor = RED; ctx.shadowBlur = 30; ctx.beginPath(); ctx.arc(140, -70, 14, 0, 7); ctx.fill();
  ctx.restore();
  glowingEyes(W / 2, H * 0.3 + 10, 10, RED, prog(lt, 0.5, 0.7));
  txt("CAUGHT", W / 2, H * 0.47, 210, { scale: lerp(2, 1, easeBack(prog(lt, 0.15, 0.45))), alpha: prog(lt, 0.15, 0.3), stroke: "#000", strokeW: 20, glitch: 6 });
  txt("ON CAMERA", W / 2, H * 0.57, 160, { scale: lerp(2, 1, easeBack(prog(lt, 0.25, 0.55))), alpha: prog(lt, 0.25, 0.4), color: RED, stroke: "#000", strokeW: 16, glow: RED });
  const ck = prog(lt, 0.9, 1.2);
  const pulse = 1 + Math.sin(lt * 8) * 0.04 * prog(lt, 1.3, 1.5);
  pill("PLAY FREE ON ROBLOX", W / 2, H * 0.68, 66, "#fff", { scale: lerp(0.5, 1, easeBack(ck)) * pulse, alpha: ck, glow: 50 });
  if (lt > 1.5) popText("CAN YOU CATCH THEM ALL?", W / 2, H * 0.76, 62, lt - 1.5, { color: GOLD, stagger: 0.018, from: 1.6 });
  flash(1 - prog(lt, 0, 0.2));
  // final shutter
  flash(prog(lt, 3.75, 3.85) * (1 - prog(lt, 3.85, 4.0)));
  grain(lt, 0.1); vignette(0.8);
});

window.renderFrame = function (t) {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.filter = "none";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  for (const s of scenes) if (t >= s.start && t < s.end) { ctx.save(); s.draw(t - s.start, s.end - s.start); ctx.restore(); break; }
  ctx.restore();
};

window.adReady = document.fonts.load('100px "Anton"').then(() => document.fonts.load('100px "Elite"')).then(() => document.fonts.ready);
window.DURATION = DURATION; window.FPS = FPS;

if (!location.search.includes("render")) {
  let t0 = null;
  window.adReady.then(() => {
    const loop = now => { if (t0 == null) t0 = now; const t = ((now - t0) / 1000) % DURATION; renderFrame(t); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
  cv.addEventListener("click", () => { t0 = null; });
} else document.body.classList.add("render");
</script>
</body>
